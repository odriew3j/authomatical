services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: authomatical
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: authomatical
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authomatical -d authomatical"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once after PostgreSQL is healthy. Worker services only start after
  # this completes successfully, so production schema changes stay explicit.
  migrate:
    build: .
    command: python -m alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://authomatical:${POSTGRES_PASSWORD:-changeme}@postgres:5432/authomatical
    depends_on:
      postgres:
        condition: service_healthy

  # Enable with: docker compose --profile bale up -d --build
  bale-worker:
    profiles: ["bale"]
    build: .
    command: python -m workers.bale_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://authomatical:${POSTGRES_PASSWORD:-changeme}@postgres:5432/authomatical
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads

  # Enable with: docker compose --profile telegram up -d --build
  telegram-worker:
    profiles: ["telegram"]
    build: .
    command: python -m workers.telegram_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://authomatical:${POSTGRES_PASSWORD:-changeme}@postgres:5432/authomatical
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads

  # Always pair this with whichever bot profile(s) you enable; it consumes
  # queued article jobs and publishes them to each tenant's own site.
  article-worker:
    build: .
    command: python -m workers.article_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://authomatical:${POSTGRES_PASSWORD:-changeme}@postgres:5432/authomatical
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  uploads:
