# Railway deployment reference. Provision/link PostgreSQL and Redis in Railway,
# then set the listed variables on the corresponding service. Docker Compose
# (documented in DEPLOY.md) remains the easiest all-in-one local deployment.
services:
  web:
    build: .
    start: gunicorn services.web_app:app --bind 0.0.0.0:$PORT
    env:
      - DATABASE_URL
      - REDIS_URL
      - SECRET_KEY
      - TELEGRAM_BOT_USERNAME
      - BALE_BOT_USERNAME
      - CONNECT_TOKEN_TTL_SECONDS
      - CONNECT_VERIFICATION_TIMEOUT_SECONDS
      - CONNECT_REGISTRATION_PROOF_MAX_AGE_SECONDS

  # Publish this service at a public HTTPS domain for the WordPress plugin.
  # Keep the separate web dashboard private/authenticated.
  connect:
    build: .
    # Do not emit raw bearer QR paths via Gunicorn access logging.
    start: gunicorn services.connect_app:app --bind 0.0.0.0:$PORT --access-logfile /dev/null
    env:
      - DATABASE_URL
      - SECRET_KEY
      - TELEGRAM_BOT_USERNAME
      - BALE_BOT_USERNAME
      - CONNECT_TOKEN_TTL_SECONDS
      - CONNECT_VERIFICATION_TIMEOUT_SECONDS
      - CONNECT_REGISTRATION_PROOF_MAX_AGE_SECONDS

  worker_article:
    build: .
    start: python -m workers.article_worker
    env:
      - DATABASE_URL
      - REDIS_URL
      - SECRET_KEY
      - OPENROUTER_API_KEY
      - OPENROUTER_MODEL
      - TELEGRAM_BOT_TOKEN
      - BALE_BOT_TOKEN
      - MAX_RETRIES
      - TIMEOUT

  worker_telegram:
    build: .
    start: python -m workers.telegram_worker
    env:
      - DATABASE_URL
      - REDIS_URL
      - SECRET_KEY
      - OPENROUTER_API_KEY
      - OPENROUTER_MODEL
      - TELEGRAM_BOT_TOKEN
      - MAX_RETRIES
      - TIMEOUT

  worker_bale:
    build: .
    start: python -m workers.bale_worker
    env:
      - DATABASE_URL
      - REDIS_URL
      - SECRET_KEY
      - OPENROUTER_API_KEY
      - OPENROUTER_MODEL
      - BALE_BOT_TOKEN
      - MAX_RETRIES
      - TIMEOUT
